services:
  auth-service:
    build: .
    container_name: auth-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,https://meuappsm.cesaryamanaka.com.br}
    ports:
      - "8001:8000"   # host:container -> acessível em http://SEU_SERVIDOR:8001
    networks:
      - plataforma_network

networks:
  plataforma_network:
    external: true   # não cria a rede, usa a que já existe no seu servidor

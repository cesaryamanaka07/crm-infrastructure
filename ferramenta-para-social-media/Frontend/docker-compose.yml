services:
  frontend:
    build:
      context: .
      dockerfile: dockerfile

    container_name: social-media-frontend

    restart: unless-stopped

    ports:
      - "5173:5173"

    environment:
      VITE_AUTH_SERVICE_URL: ${VITE_AUTH_SERVICE_URL}

    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules

    networks:
      - plataforma_network

volumes:
  frontend_node_modules:

networks:
  plataforma_network:
    external: true
